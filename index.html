  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;

    .canva-embed {
      position: relative;
      width: 100vw;
      min-height: 100vh;

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

</head>
